name: CI

on:
  workflow_call:

permissions:
  contents: read

jobs:
  validate:
    name: Validate (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Type check
        run: npm run lint
      - name: Build
        run: npm run build
      - name: Unit and MCP integration tests
        run: npm test
      - name: Audit dependencies
        run: npm audit --audit-level=moderate
      - name: Verify build output
        run: test -s dist/index.js && test -s dist/whmcs-client.js
